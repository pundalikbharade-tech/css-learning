<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>repeat</title>
    <style>
      .repeat {
        width: 100%;
        height: 600px;
        border: 2px solid black;
        font-size: 24px;
        background-image: url(img/Anupama.jpg);
        background-repeat: repeat;
      }
      .no-repeat {
        width: 100%;
        height: 600px;
        border: 2px solid black;
        font-size: 24px;
        margin-top: 10px;
        background-image: url(img/Anupama.jpg);
        background-repeat: no-repeat;
      }
      .repeat-x {
        width: 100%;
        height: 600px;
        border: 2px solid black;
        font-size: 24px;
        margin-top: 10px;
        background-image: url(img/Anupama.jpg);
        background-repeat: repeat-x;
      }
      .repeat-y {
        width: 100%;
        height: 2000px;
        border: 2px solid black;
        font-size: 24px;
        margin-top: 10px;
        background-image: url(img/Anupama.jpg);
        background-repeat: repeat-y;
      }
    </style>
  </head>
  <body>
    <div class="repeat">repeat</div>
    <div class="no-repeat">no-repeat</div>
    <div class="repeat-x">repeat-x</div>
    <div class="repeat-y">repeat-y</div>
  </body>
</html>
