<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>box and text shadow</title>
    <style>
      body {
        background-color: beige;
      }
      .container {
        background-color: azure;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 500px;
        width: 500px;
        border: 2px solid black;
        font-size: 24px;
        margin: auto;
        margin-top: 250px;
        color: blue;
        box-shadow: 3px 3px 10px 2px black;
        text-shadow: 2px 2px 3px red;
      }
    </style>
  </head>
  <body>
    <div class="container">TEXT SHADOW</div>
  </body>
</html>
