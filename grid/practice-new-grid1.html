<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>grid</title>
    <style>
      .container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .container > div {
        border: 2px solid black;
      }
      .container > div:nth-child(1) {
        grid-column-start: 1;
        grid-column-end: 2;
      }
      .container > div:nth-child(2) {
        grid-column-start: 2;
        grid-column-end: 3;
      }
      .container > div:nth-child(3) {
        grid-column-start: 3;
        grid-column-end: 4;
      }
      .container > div:nth-child(4) {
        grid-column-start: 1;
        grid-column-end: 2;
      }
      .container > div:nth-child(5) {
        grid-column-start: 2;
        grid-column-end: 4;
      }
      .container > div:nth-child(6) {
        grid-column-start: 1;
        grid-column-end: 2;
      }
      .container > div:nth-child(7) {
        grid-column-start: 2;
        grid-column-end: 3;
      }
      .container > div:nth-child(8) {
        grid-column-start: 3;
        grid-column-end: 4;
      }
      .container > div:nth-child(9) {
        grid-column-start: 1;
        grid-column-end: 4;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
      <div>6</div>
      <div>7</div>
      <div>8</div>
      <div>9</div>
    </div>
  </body>
</html>
