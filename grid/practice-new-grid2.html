<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .page {
        display: grid;
        grid-template-rows: 80px 1fr 1fr 80px;
        grid-template-columns: 250px 1fr 1fr;
        min-height: 100vh;
        gap: 10px;
      }
      header,
      footer {
        grid-column: 1/-1;
        background: pink;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
      }
      aside {
        background-color: yellow;
        grid-row: 2 / span 2;
      }
      .card1 {
        background: lightgreen;
      }

      .card2 {
        background: lightblue;
      }

      .card3 {
        grid-column: 2 / span 2;
        background: orange;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>header</header>
      <aside>asid</aside>

      <div class="card1">card1</div>
      <div class="card2">card1</div>
      <div class="card3">card3</div>

      <footer>footer</footer>
    </div>
  </body>
</html>
